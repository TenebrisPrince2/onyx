let openRow = null;
function enableSwipe(root, once) {
  if (once) {
    if (root.__swipeBound) return;
    root.__swipeBound = true;
  }
  let el = null, body = null, x0 = 0, y0 = 0, dx = 0, lock = null, base = 0;
  root.addEventListener('pointerdown', e => {
    const b = e.target.closest('.sw__body'); if (!b) return;
    el = b.closest('.sw'); body = b; x0 = e.clientX; y0 = e.clientY; dx = 0; lock = null;
    base = el === openRow ? -(el.querySelector('.sw__acts').offsetWidth) : 0;
  }, { passive: true });
  root.addEventListener('pointermove', e => {
    if (!el) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (lock === null) { if (Math.abs(mx) < 9 && Math.abs(my) < 9) return; lock = Math.abs(mx) > Math.abs(my) * 1.3 ? 'x' : 'y'; if (lock === 'x') el.classList.add('dragging'); }
    if (lock !== 'x') return;
    dx = clamp(base + mx, -(el.querySelector('.sw__acts').offsetWidth + 24), 22);
    body.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });
  const end = () => {
    if (!el) return;
    el.classList.remove('dragging');
    const w = el.querySelector('.sw__acts').offsetWidth;
    if (lock === 'x') {
      const open = dx < -w * .45;
      if (openRow && openRow !== el) { const ob = openRow.querySelector('.sw__body'); if (ob) ob.style.transform = ''; }
      body.style.transform = open ? 'translateX(' + (-w) + 'px)' : '';
      openRow = open ? el : null;

}
/* reorder */
function enableReorder(list, onOrder) {
  let dragEl = null, items = [], y0 = 0, from = 0, to = 0, h = 0;
  list.addEventListener('pointerdown', e => {
    const handle = e.target.closest('[data-handle]'); if (!handle) return;
    dragEl = handle.closest('[data-id]'); if (!dragEl) return;
    items = [...list.querySelectorAll(':scope > [data-id]')];
    from = to = items.indexOf(dragEl);
    const r = dragEl.getBoundingClientRect();
    h = r.height + (parseFloat(getComputedStyle(list).rowGap) || 6);
    y0 = e.clientY; dragEl.classList.add('dragging');
    dragEl.style.zIndex = 5; dragEl.style.transition = 'none';
    handle.setPointerCapture(e.pointerId); haptic(10); e.preventDefault();
  });
  list.addEventListener('pointermove', e => {
    if (!dragEl) return;
    const dy = e.clientY - y0;
    dragEl.style.transform = 'translate3d(0,' + dy + 'px,0) scale(1.02)';
    const nt = clamp(from + Math.round(dy / h), 0, items.length - 1);
    if (nt !== to) {
      to = nt; haptic(4);
      items.forEach((it, i) => {
        if (it === dragEl) return;
        let sh = 0;
        if (from < to && i > from && i <= to) sh = -h;
        if (from > to && i < from && i >= to) sh = h;
        it.style.transform = sh ? 'translate3d(0,' + sh + 'px,0)' : '';
      });
    }
  });
  const end = () => {
    if (!dragEl) return;
    dragEl.classList.remove('dragging'); dragEl.style.zIndex = ''; dragEl.style.transition = '';
    items.forEach(it => it.style.transform = '');
    dragEl.style.transform = '';
    if (to !== from) { const ids = items.map(i => i.dataset.id); const [m] = ids.splice(from, 1); ids.splice(to, 0, m); onOrder(ids); }
    dragEl = null;
  };
  list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
}

function computeInsights(r, accId) {
  const list = scopeTxns(r, accId);
  const cur = accId ? accById(accId).currency : S.settings.currency;
  const exp = list.filter(t => t.type === 'expense'), inc = list.filter(t => t.type === 'income');
  const days = Math.max(1, Math.round((r.to - r.from) / 86400000) + 1);
  const totalExp = sum(exp.map(t => t.amount)), totalInc = sum(inc.map(t => t.amount));

  const biggestExp = exp.slice().sort((a, b) => b.amount - a.amount)[0];
  const biggestInc = inc.slice().sort((a, b) => b.amount - a.amount)[0];

  const byDay = {}; exp.forEach(t => { const k = dkey(t); byDay[k] = (byDay[k] || 0) + t.amount; });
  const topDayEntry = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];

  const byCat = {}; exp.forEach(t => { const k = t.categoryId || '__none'; byCat[k] = (byCat[k] || 0) + 1; });
  const topCatEntry = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];

  let weekendSum = 0;
  exp.forEach(t => { const wd = new Date(t.date).getDay(); if (wd === 0 || wd === 6) weekendSum += t.amount; });

  const endForStreak = r.to > new Date() ? new Date() : r.to;
  let streak = 0, d = sod(endForStreak);
  while (streak < 365) {
    const k = iso(d);
    if (S.transactions.some(t => t.type === 'expense' && dkey(t) === k && (!accId || t.accountId === accId))) break;
    streak++; d = addD(d, -1);
  }

  const prevR = { from: addD(r.from, -days), to: addD(r.from, -1) };
  const prevExp = sum(scopeTxns(prevR, accId).filter(t => t.type === 'expense').map(t => t.amount));

  return {
    cur, days, totalExp, totalInc, txnCount: list.length,
    avgDaily: totalExp / days,
    biggestExp, biggestInc,
    topDay: topDayEntry ? { key: topDayEntry[0], v: topDayEntry[1] } : null,
    topCat: topCatEntry ? { cat: topCatEntry[0] === '__none' ? null : catById(topCatEntry[0]), n: topCatEntry[1] } : null,
    weekendPct: totalExp ? Math.round(weekendSum / totalExp * 100) : 0,
    savingsRate: totalInc ? Math.round((totalInc - totalExp) / totalInc * 100) : null,
    streak,
    cmpPct: prevExp ? Math.round((totalExp - prevExp) / prevExp * 100) : null
  };
}

function makeTemplate() {

function saveEditor() {

function pickDate(cur, fn) {

      '<span data-handle style="padding:8px 2px 8px 6px;color:var(--t3);touch-action:none"><i data-lucide="grip-vertical" class="ic ic-s"></i></span>' +

    '<p style="color:var(--t3);font-size:13px;line-height:1.55;padding:18px 6px 0">Потяните за ручку, чтобы изменить порядок. Баланс считается от начального значения и всех операций.</p>' +
    '</div>';
}
function accMount(el) {
  el.querySelector('[data-act="close"]').onclick = () => popScreen();
  el.querySelector('[data-act="new-acc"]').onclick = () => openAccountForm();
  const pickAll = el.querySelector('[data-act="pick-all"]');
  if (pickAll) pickAll.onclick = () => { UI.accId = null; UI.ledger.day = null; UI.ledger.limit = 50; haptic(); render(); popScreen(); };
  el.querySelectorAll('[data-act="pick-acc"]').forEach(b => b.onclick = e => { if (e.target.closest('[data-act="edit-acc"]') || e.target.closest('[data-handle]')) return; UI.accId = b.dataset.id; UI.ledger.day = null; UI.ledger.limit = 50; haptic(); render(); popScreen(); });
  el.querySelectorAll('[data-act="edit-acc"]').forEach(b => b.onclick = e => { e.stopPropagation(); openAccountForm({ id: b.dataset.id }); });
  enableReorder(el.querySelector('#accList'), ids => { ids.forEach((id, i) => { const a = accById(id); if (a) a.order = i; }); save(); refreshTop(); render(true); setTimeout(() => nav[nav.length - 1].refresh(), 10); });
}

/* ═══════════════════════════════ 9. categories ═══════════════════════════════ */
function openCategories() {
  const rec = pushScreen({ id: 'cats', push: true, html: catsHTML(), mount: catsMount, refresh: () => { rec.el.innerHTML = catsHTML(); icons(); catsMount(rec.el); } });
}
function catsHTML() {
  const kind = UI.catKind;
  const tops = topCats(kind);
  return '<div class="shead"><button class="iconbtn" data-act="close"><i data-lucide="x" class="ic"></i></button><h2>Категории</h2><span class="spacer"></span>' +
    '<button class="iconbtn" data-act="new-cat" aria-label="Добавить"><i data-lucide="plus" class="ic"></i></button></div>' +
    '<div style="padding:0 14px 12px;max-width:300px;margin:0 auto;width:100%">' + segHTML('kind', kind, [['income', 'Доход', ARR_IN], ['expense', 'Расход', ARR_OUT]]) + '</div>' +
    '<div class="screen__body"><div id="catList" style="display:flex;flex-direction:column;gap:6px;padding-top:4px">' +
    tops.map(c => {
      const kids = childrenOf(c.id);
      const spent = sum(S.transactions.filter(t => t.type === kind && [c.id, ...kids.map(k => k.id)].includes(t.categoryId) && inRange(t, periodRange('month', 0).from, periodRange('month', 0).to)).map(t => t.amount));
      return '<div class="sw" data-id="' + c.id + '" style="transition:transform .22s var(--eo)">' +
        '<div class="sw__body" style="cursor:default"><span class="tile" style="--c:' + c.color + '"><i data-lucide="' + catLuc(c.icon) + '" class="ic"></i></span>' +
        '<span class="row__main"><span class="row__t">' + esc(c.name) + '</span><span class="row__s">' + (kids.length ? kids.length + ' подкатегории · ' : '') + (spent ? money(spent) + ' за месяц' : 'нет операций в этом месяце') + '</span></span>' +
        '<button class="iconbtn" style="width:34px;height:34px" data-act="edit-cat" data-id="' + c.id + '"><i data-lucide="pencil" class="ic ic-s"></i></button>' +
        '<span data-handle style="padding:8px 2px 8px 6px;color:var(--t3);touch-action:none"><i data-lucide="grip-vertical" class="ic ic-s"></i></span></div></div>' +
        (kids.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 6px 22px">' + kids.map(k =>
          '<button class="chip chip--flat" style="padding:7px 13px;font-size:13.5px" data-act="edit-cat" data-id="' + k.id + '"><i data-lucide="' + catLuc(k.icon) + '" class="ic ic-s" style="color:' + k.color + '"></i>' + esc(k.name) + '</button>').join('') + '</div>' : '');
    }).join('') + '</div>' +
    '<button class="btn btn--ghost btn--sm" style="margin-top:16px" data-act="new-cat"><i data-lucide="plus" class="ic"></i>Новая категория</button>' +
    '<p style="color:var(--t3);font-size:13px;line-height:1.55;padding:16px 6px 0">Подкатегории считаются внутри родителя в аналитике.</p></div>';
}
function catsMount(el) {
  el.querySelector('[data-act="close"]').onclick = () => popScreen();
  el.querySelectorAll('[data-act="new-cat"]').forEach(b => b.onclick = () => openCategoryScreen({ kind: UI.catKind }));
  el.querySelectorAll('[data-act="edit-cat"]').forEach(b => b.onclick = () => openCategoryScreen({ id: b.dataset.id }));
  bindSeg(el, 'kind', v => { UI.catKind = v; nav[nav.length - 1].refresh(); });
  enableReorder(el.querySelector('#catList'), ids => { ids.forEach((id, i) => { const c = catById(id); if (c) c.order = i; }); save(); nav[nav.length - 1].refresh(); });
}

/* ═══════════════════════════════ 12. drill-down ═══════════════════════════════ */
function openDrill(catId) {
  const r = asRange();
  const c = catId === 'none' ? null : catById(catId);
  const ids = c ? [c.id, ...childrenOf(c.id).map(x => x.id)] : [null, undefined];
  const list = scopeTxns(r, UI.accId).filter(t => asKind(t, AS.kind) && (c ? ids.includes(t.categoryId) : !t.categoryId)).sort((a, b) => b.date.localeCompare(a.date));
  const total = sum(list.map(t => t.amount));
  const groups = {};
  list.forEach(t => { (groups[dkey(t)] = groups[dkey(t)] || []).push(t); });
  const rec = pushScreen({
    id: 'drill', push: true,
    html: '<div class="shead"><button class="iconbtn" data-act="close"><i data-lucide="arrow-left" class="ic"></i></button><h2>' + esc(c ? c.name : 'Без категории') + '</h2></div>' +
      '<div class="screen__body"><div class="hero" style="padding-top:4px"><div class="hero__lab">' + esc(r.label) + '</div>' +
      '<h1 class="hero__amt">' + money(total) + '</h1><div class="hero__alt">' + list.length + ' операций · в среднем ' + money(total / Math.max(1, list.length)) + '</div></div>' +
      Object.keys(groups).sort().reverse().map(k => '<div class="dayhead"><b>' + dayLabel(k) + '</b><span>' + money(sum(groups[k].map(t => t.amount))) + '</span></div><div class="group">' + groups[k].map((t, i) => txnRow(t, i)).join('') + '</div>').join('') + '</div>',
    mount(el) {
      el.querySelector('[data-act="close"]').onclick = () => popScreen();
      enableSwipe(el);
      el.addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if (!b) return;
        if (b.dataset.act === 'open-txn' || b.dataset.act === 'edit-txn') openEditor({ id: b.dataset.id });

    }

}

  else if (a === 'del-txn') delTxn(id);
  else if (a === 'add') openEditor({ type: b.dataset.type || 'expense', date: b.dataset.date });
  else if (a === 'mprev') { UI.ledger.off--; UI.ledger.day = null; UI.ledger.limit = 50; render(); }
  else if (a === 'mnext') { if (UI.ledger.off < 0) { UI.ledger.off++; UI.ledger.day = null; UI.ledger.limit = 50; render(); } }
  else if (a === 'pick-period') openPeriodPicker();
  else if (a === 'clear-day') { UI.ledger.day = null; UI.ledger.limit = 50; haptic(); render(true); }
  else if (a === 'more') { UI.ledger.limit = (UI.ledger.limit || 50) + 50; haptic(); render(true); }
  else if (a === 'insights') openInsights();
  else if (a === 'toggle-hide') { S.settings.hideAmounts = !S.settings.hideAmounts; save(); haptic(); render(true); }
  else if (a === 'wipe-demo') wipeDemo();
});

async function wipeDemo() {
  if (!await confirmSheet({ title: 'Очистить демо-данные?', text: 'Удалим сгенерированные операции и цели. Счета и категории останутся.', ok: 'Очистить' })) return;
  S.transactions = []; S.goals = []; S.templates = [];
  S.accounts.forEach(a => a.initial = 0);
  S.settings.demo = false; save(); render(); toast('Готово, можно начинать с нуля');
}

/* templates run */
function runTemplates() {
  let n = 0;
  const today = iso(new Date());
  S.templates.forEach(t => {
    let guard = 0;
    while (t.next && t.next <= today && guard++ < 24) {
      S.transactions.push({ id: uid(), type: t.type, amount: t.amount, accountId: t.accountId, toAccountId: t.toAccountId, categoryId: t.categoryId, note: t.note || t.name, date: t.next + 'T09:00' });
      n++;
      t.next = t.every === 'week' ? iso(addD(new Date(t.next + 'T00:00:00'), 7)) : iso(addM(new Date(t.next + 'T00:00:00'), 1));
    }
  });
  if (n) { S.transactions.sort((a, b) => b.date.localeCompare(a.date)); save(); setTimeout(() => toast('Добавлено повторяющихся: ' + n), 900); }
}
/* reminder */
try {
  const cut = iso(addD(new Date(), -7));
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.indexOf('onyx.rem.') === 0 && k.slice(9) < cut) localStorage.removeItem(k);
  }
} catch (e) {}
setInterval(() => {
  const r = S.settings.reminder;
  if (!r.enabled) return;
  const now = new Date(), hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  if (hm !== r.time) return;
  const key = 'onyx.rem.' + iso(now);
  if (localStorage.getItem(key)) return;
  localStorage.setItem(key, '1');
  const spent = sum(S.transactions.filter(t => t.type === 'expense' && dkey(t) === iso(now)).map(t => t.amount));
  const msg = spent ? 'Сегодня потрачено ' + money(spent) + '. Всё внесли?' : 'Сегодня трат не записано. Всё верно?';
  try {
    if ('Notification' in window && Notification.permission === 'granted') new Notification('Onyx', { body: msg });
    else toast(msg);
  } catch (e) { toast(msg); }
}, 30000);

/* deeplinks */
function handleHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return;
  const [path, qs] = h.split('?');
  const p = new URLSearchParams(qs || '');
  if (path === 'add') {
    openEditor({
      type: ['expense', 'income', 'transfer', 'adjust'].includes(p.get('type')) ? p.get('type') : 'expense',
      amount: p.get('amount') ? parseFloat(p.get('amount').replace(',', '.')) : 0,
      categoryId: p.get('cat') && catById(p.get('cat')) ? p.get('cat') : null,
      accountId: p.get('acc') && accById(p.get('acc')) ? p.get('acc') : undefined,
      note: p.get('note') || ''
    });
  } else if (path === 'stats') openStats();
  else if (path === 'goals') openGoals();
  history.replaceState({}, '', location.pathname + location.search);
}

/* ═══════════════════════════════ 17. PWA ═══════════════════════════════ */
const APP_ICON = size => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="' + size + '" height="' + size + '">' +
  '<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17171b"/><stop offset="1" stop-color="#050507"/></linearGradient>' +
  '<linearGradient id="b" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#8e8e97" stop-opacity=".7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".9"/></linearGradient></defs>' +
  '<rect width="512" height="512" rx="112" fill="url(#a)"/>' +
  '<path d="M96 232c0-58 46-92 128-80s112 30 176 14 32 96-12 132-108 60-176 46S96 290 96 232Z" fill="url(#b)" opacity=".9"/>' +
  '<path d="M104 246c0-52 44-84 122-72s110 28 172 13" stroke="#fff" stroke-opacity=".5" stroke-width="7" fill="none"/></svg>';
const dataURI = s => 'data:image/svg+xml,' + encodeURIComponent(s);
(function pwa() {
  /* icons */
  const l1 = document.createElement('link'); l1.rel = 'icon'; l1.type = 'image/svg+xml'; l1.href = dataURI(APP_ICON(64)); document.head.appendChild(l1);
  const l2 = document.createElement('link'); l2.rel = 'apple-touch-icon'; l2.sizes = '180x180'; l2.href = dataURI(APP_ICON(180)); document.head.appendChild(l2);
  /* service worker: versioned cache, network-first for navigations */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
    const onWaiting = w => { toast('Доступна новая версия', { label: 'Обновить', fn: () => w.postMessage({ type: 'SKIP_WAITING' }) }); };
    navigator.serviceWorker.register('./sw.js').then(reg => {
      if (reg.waiting) onWaiting(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) onWaiting(w); });
      });
      navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'NEW_VERSION') onWaiting(reg.waiting); });
    }).catch(() => {});
    window.addEventListener('load', () => {
      window.addEventListener('online', () => toast('Снова в сети'));
      window.addEventListener('offline', () => toast('Нет соединения — работаем офлайн', null, { icon: 'wifi-off' }));
    });
  }
})();

/* ═════════════════════ diag HUD (временно: диагностика чёрной полосы внизу) ═════════════════════
   Показывает при запуске: сборку, режим запуска, высоты вьюпорта и env(safe-area-inset-bottom).
   Тап — скрыть. Убрать блок целиком после диагностики. */
(function diagHUD() {
  const el = document.createElement('div');
  el.id = 'dghud';
  el.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:2147483000;max-width:82vw;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.9);color:#4ade80;border:1px solid rgba(74,222,128,.45);font:600 11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.6)';
  /* Автокоррекция застрявшего layout-вьюпорта в iOS standalone:
     если окно (outerHeight) заметно выше layout-вьюпорта — растягиваем корень на окно.
     Пересчитывается на каждый resize/поворот, чтобы не залипать в одной ориентации. */
  let fixed = false;
  const applyFix = () => {
    const gap = (window.outerHeight || 0) - document.documentElement.clientHeight;
    if (matchMedia('(display-mode: standalone)').matches && gap > 20) {
      document.documentElement.style.setProperty('--appH', window.outerHeight + 'px');
      fixed = true;
    } else {
      document.documentElement.style.removeProperty('--appH');
      fixed = false;
    }
  };
  const upd = () => {
    applyFix();
    const vv = window.visualViewport;
    const sab = getComputedStyle(document.documentElement).getPropertyValue('--bot').trim();
    const ph = document.getElementById('phone');
    const phH = ph ? Math.round(ph.getBoundingClientRect().height) : -1;
    el.textContent = [
      'BUILD 26.08.16-B8',
      'mode: ' + (matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser') + (window.navigator.standalone ? ' +nsa' : ''),
      'innerW/H: ' + window.innerWidth + 'x' + window.innerHeight,
      'outerH: ' + window.outerHeight,
      'docH: ' + document.documentElement.clientHeight,
      'vv: ' + (vv ? Math.round(vv.height) + ' top ' + Math.round(vv.offsetTop) + ' scale ' + vv.scale.toFixed(3) : 'n/a'),
      'sab: ' + sab,
      'phoneH: ' + phH + (fixed ? ' (fix on)' : ''),
      'screen: ' + screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio || 1)
    ].join('\n');
  };
  upd();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', upd);
  window.addEventListener('resize', upd);
  window.addEventListener('orientationchange', upd);
  el.addEventListener('click', () => el.remove());
  const mount = () => { document.body.appendChild(el); setTimeout(() => el.remove(), 20000); };
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount, { once: true });
})();

/* ═══════════════════════════════ 18. boot ═══════════════════════════════ */
function boot() {
  subscribe(() => { if (!nav.length && !sheetStack.length) render(true); });
  load();
  runTemplates();
  render();
  icons();
  history.replaceState({ depth: 0 }, '');
  const start = () => { handleHash(); };
  if (S.settings.pin) { $('#phone').style.visibility = 'hidden'; showLock(() => { $('#phone').style.visibility = ''; start(); }); }
  else start();
  const sp = $('#splash');
  setTimeout(() => { sp.classList.add('gone'); setTimeout(() => sp.remove(), 700); }, 480);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(icons, 20));
window.addEventListener('hashchange', handleHash);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (AccountFormScreen && AccountFormScreen.handleEscape()) return; if (CategoryFormScreen && CategoryFormScreen.handleEscape()) return; if (GoalFormScreen && GoalFormScreen.handleEscape()) return; if (sheetStack.length) closeSheet(); else if (nav.length) popScreen(); });
boot();
</script>
